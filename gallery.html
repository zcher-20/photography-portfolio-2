  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    document.querySelectorAll('.series-cover').forEach(cover => {
      cover.addEventListener('click', () => {
        document.getElementById('series-index').style.display = 'none';
        document.getElementById('series-' + cover.dataset.series).style.display = 'block';
      });
    });

    ['london', 'nyc', 'switzerland', 'portraits', 'travel', 'dubai', 'italy', 'portugal', 'morocco'].forEach(series => {
      document.getElementById('back-' + series).addEventListener('click', () => {
        document.getElementById('series-' + series).style.display = 'none';
        document.getElementById('series-index').style.display = 'flex';
      });

      const grid = document.getElementById('grid-' + series);
      const front = document.getElementById('center-front-' + series);
      const back = document.getElementById('center-back-' + series);

      gsap.set(front, { opacity: 0 });
      gsap.set(back, { opacity: 0 });

      let visible = false;

      grid.querySelectorAll('.grid-thumb').forEach(thumb => {
        thumb.addEventListener('mouseenter', () => {
          const src = thumb.dataset.src;
          front.setAttribute('data-loading', src);
          const img = new Image();
          img.src = src;
          img.onload = () => {
            if (front.getAttribute('data-loading') !== src) return;
            back.src = src;
            gsap.killTweensOf(front);
            if (!visible) {
              front.src = src;
              gsap.to(front, { opacity: 1, duration: 0.35, ease: 'power2.out' });
              grid.classList.add('dimmed');
              visible = true;
            } else {
              gsap.to(front, { opacity: 0, duration: 0.15, ease: 'power2.in', onComplete: () => {
                front.src = src;
                gsap.to(front, { opacity: 1, duration: 0.25, ease: 'power2.out' });
              }});
            }
          };
        });
      });

      grid.addEventListener('mouseleave', () => {
        gsap.killTweensOf(front);
        gsap.to(front, { opacity: 0, duration: 0.3, ease: 'power2.inOut' });
        grid.classList.remove('dimmed');
        visible = false;
      });
    });
  </script>
</body>
