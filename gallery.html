        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    // Preload cover images and fade in
    document.querySelectorAll('.series-cover-img').forEach(el => {
      const url = el.style.backgroundImage.replace(/url\(["']?|["']?\)/g, '');
      const img = new Image();
      img.onload = () => el.classList.add('loaded');
      img.src = url;
    });

    // Staggered cover entrance
    gsap.from('.series-cover', {
      opacity: 0, duration: 0.8, stagger: 0.1, ease: 'power2.out', delay: 0.1
    });
  </script>
