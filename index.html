  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    const heroFront = document.getElementById('hero-img');
    const heroBack = document.getElementById('hero-img-back');
    const hero = heroFront;
    const strip = document.querySelector('.thumbnail-strip');
const thumbs = document.querySelectorAll('.thumbnail');
    const defaultSrc = heroFront.src;
    const defaultAlt = heroFront.alt;
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');

    function sampleBrightness(img) {
      try {
        canvas.width = 64;
        canvas.height = 64;
        ctx.drawImage(img, 0, 0, 64, 64);
        const data = ctx.getImageData(0, 0, 64, 16).data;
        let total = 0;
        for (let i = 0; i < data.length; i += 4) {
          total += data[i] * 0.299 + data[i+1] * 0.587 + data[i+2] * 0.114;
        }
        return total / (data.length / 4);
      } catch (e) {
        return 180;
      }
    }

    function updateUI() {
      const brightness = sampleBrightness(hero);
      document.body.classList.toggle('light-ui', brightness < 140);
    }

    function reveal() {
      document.body.classList.remove('loading');
    }

    hero.addEventListener('load', () => { updateUI(); reveal(); });
    if (hero.complete) { updateUI(); reveal(); }

    // Parallax — scale slightly to avoid edge gaps
    gsap.set([heroFront, heroBack], { scale: 1.06 });
    document.addEventListener('mousemove', (e) => {
      const x = (e.clientX / window.innerWidth  - 0.5) * 10;
      const y = (e.clientY / window.innerHeight - 0.5) * 10;
      gsap.to([heroFront, heroBack], { x, y, duration: 1.6, ease: 'power1.out', overwrite: 'auto' });
    });

    let swapTimeout = null;
    function swapHero(src, alt) {
      clearTimeout(swapTimeout);
      swapTimeout = setTimeout(() => {
        const img = new Image();
        img.src = src;
        img.onload = () => {
          heroBack.src = src;
          gsap.killTweensOf(heroFront);
          gsap.to(heroFront, { opacity: 0, duration: 0.25, ease: 'power2.inOut', onComplete: () => {
            heroFront.src = src;
            heroFront.alt = alt;
            gsap.to(heroFront, { opacity: 1, duration: 0.25, ease: 'power2.inOut' });
            updateUI();
          }});
        };
      }, 20);
    }

    strip.addEventListener('mouseleave', () => {});

    thumbs.forEach(thumb => {
      thumb.addEventListener('mouseenter', () => {
        swapHero(thumb.dataset.src, thumb.querySelector('img').alt);
      });
    });

    // Lightbox
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const cursorLabel = document.getElementById('lightbox-cursor');
    const sources = Array.from(thumbs).map(t => t.dataset.src);
    let lightboxIndex = 0;
    let onImage = false;

    thumbs.forEach((thumb, i) => {
      thumb.addEventListener('click', () => {
        lightboxIndex = i;
        openLightbox(sources[lightboxIndex]);
      });
    });

    function openLightbox(src) {
      lightboxImg.style.opacity = 1;
      lightboxImg.src = src;
      lightbox.classList.add('open');
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      cursorLabel.style.opacity = '0';
    }

    function nextImage() {
      lightboxIndex = (lightboxIndex + 1) % sources.length;
      gsap.to(lightboxImg, { opacity: 0, duration: 0.2, ease: 'power2.inOut', onComplete: () => {
        const next = new Image();
        next.src = sources[lightboxIndex];
        next.onload = () => {
          lightboxImg.src = next.src;
          gsap.to(lightboxImg, { opacity: 1, duration: 0.2, ease: 'power2.inOut' });
        };
      }});
    }

    lightboxImg.addEventListener('mouseenter', () => { onImage = true; });
    lightboxImg.addEventListener('mouseleave', () => { onImage = false; });

    lightboxImg.addEventListener('click', (e) => {
      e.stopPropagation();
      nextImage();
    });

    lightbox.addEventListener('click', () => {
      closeLightbox();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && lightbox.classList.contains('open')) {
        closeLightbox();
      }
    });

    document.addEventListener('mousemove', (e) => {
      if (!lightbox.classList.contains('open')) return;
      cursorLabel.style.left = e.clientX + 12 + 'px';
      cursorLabel.style.top = e.clientY + 12 + 'px';
      const isNext = onImage;
      cursorLabel.textContent = isNext ? '[NEXT]' : '[ESC]';
      cursorLabel.style.background = isNext ? '#111' : '#fff';
      cursorLabel.style.color = isNext ? '#f0f0f0' : '#111';
      cursorLabel.style.opacity = '1';
    });
  </script>
